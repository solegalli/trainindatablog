<ul class="category-pills">
  {% assign sorted_categories = site.categories | sort %}
  {% for category in sorted_categories %}
  <li>
    <a href="{{ category[0] | slugify | prepend: '/categories/' | append: '/' | relative_url }}">
      <span class="category-pill-name">{{ category[0] }}</span>
      <span class="category-pill-count">{{ category[1] | size }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
